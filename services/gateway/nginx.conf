worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # nginx resolves upstream server names once at startup and caches them
    # forever; recreated containers get new IPs and the gateway 502s until it
    # is restarted. Resolve via Docker's embedded DNS instead.
    resolver 127.0.0.11 valid=10s ipv6=off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Each service is named in production (...counter.dev) and locally
    # (...counterdev.test, via /etc/hosts) — parity between both environments.
    # The local names sit under a two-label base (.counterdev.test) so the
    # browser sees counterdev.test and api.counterdev.test as same-site and
    # lets the SameSite=Lax session cookie flow over plain HTTP (a bare
    # "counterdev" apex would make every subdomain a separate site and block
    # the cookie).
    # counter.dev -> frontend (static site + dashboard)
    server {
        listen 80;
        server_name counter.dev www.counter.dev counterdev counterdev.test;

        location / {
            set $upstream frontend:8080;
            proxy_pass http://$upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # t.counter.dev -> tracker (ingest endpoint)
    server {
        listen 80;
        server_name t.counter.dev t.counterdev t.counterdev.test;

        location / {
            set $upstream tracker:8001;
            proxy_pass http://$upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # api.counter.dev -> backend (Django)
    server {
        listen 80;
        server_name api.counter.dev api.counterdev.test;

        location / {
            set $upstream backend:8000;
            proxy_pass http://$upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Anything else (e.g. Host: localhost) is rejected with a static page
    # pointing at the real hostnames.
    server {
        listen 80 default_server;
        server_name _;

        root /usr/share/nginx/default;
        index index.html;

        location / {
            try_files /index.html =404;
        }

        location = /index.html {
            try_files $uri =404;
        }
    }
}