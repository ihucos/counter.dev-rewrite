worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Upstream backend servers
    upstream frontend {
        server frontend:8080;
    }

    upstream backend {
        server backend:8000;
    }

    upstream tracker {
        server tracker:8001;
    }

    # Each service is named in production (...counter.dev) and locally
    # (...counterdev, via /etc/hosts) — parity between both environments.
    # counter.dev -> frontend (static site + dashboard)
    server {
        listen 80;
        server_name counter.dev www.counter.dev counterdev;

        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # t.counter.dev -> tracker (ingest endpoint)
    server {
        listen 80;
        server_name t.counter.dev t.counterdev;

        location / {
            proxy_pass http://tracker;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # api.counter.dev -> backend (Django)
    server {
        listen 80;
        server_name api.counter.dev api.counterdev;

        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Anything else (e.g. Host: localhost) is rejected with a static page
    # pointing at the real hostnames.
    server {
        listen 80 default_server;
        server_name _;

        root /usr/share/nginx/default;
        index index.html;

        location / {
            try_files /index.html =404;
        }

        location = /index.html {
            try_files $uri =404;
        }
    }
}