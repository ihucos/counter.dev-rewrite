services:
  tracker:
    build:
      context: .
      dockerfile: Dockerfile
    # Internal only; the gateway routes /tracker/ and t.counter.dev here.
    depends_on:
      - redis
    environment:
      WEBSTATS_BIND: ":8001"
      WEBSTATS_REDIS_URL: "redis://redis:6379"
    develop:
      watch:
        - action: rebuild
          path: .
