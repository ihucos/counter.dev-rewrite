worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Behind the gateway we serve port 80; directory redirects like
        # /blog -> /blog/ must stay relative, otherwise nginx would expose
        # its internal :8080 port in the Location header.
        absolute_redirect off;

        location / {
            try_files $uri $uri/ =404;
        }

        # API endpoints served by the Django backend (the gateway forwards
        # everything here, so the API must be proxied from this nginx too).
        location ~ ^/(login|register|recover|account_edit|delete_user|feedback|delete_site|reset_token|delete_token|set_pref_site|set_pref_range|dump|lang|newsletter_register|subscribed|admin(/|$)) {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            # /dump is a long-lived Server-Sent Events stream.
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }
    }
}