services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    # Internal only; the gateway routes /backend/ and api.counter.dev here.
    # Apply migrations before serving so the stack works standalone.
    command: sh -c "uv run python manage.py migrate --no-input && uv run python manage.py runserver 0.0.0.0:8000"
    depends_on:
      - redis
      - postgres
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - .venv/
        - action: rebuild
          path: pyproject.toml
        - action: rebuild
          path: Dockerfile

  sync:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - redis
      - postgres
    restart: unless-stopped
    command: ["uv", "run", "python", "manage.py", "sync", "--forever", "--sleep", "1"]
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - .venv/
        - action: rebuild
          path: pyproject.toml
        - action: rebuild
          path: Dockerfile
